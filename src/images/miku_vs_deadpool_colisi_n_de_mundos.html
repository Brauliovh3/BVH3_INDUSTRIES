<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miku vs Deadpool: Colisión de Mundos</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            cursor: crosshair;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Capa de ruido y viñeta general */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            z-index: 10;
        }
        
        .instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 20;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>
    <div class="instruction">Desliza el ratón para mover la frontera</div>
    <canvas id="mainCanvas"></canvas>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let splitX, targetSplitX;

        // Variables de tiempo
        let frame = 0;

        // Colores temáticos
        const MIKU_CYAN = '#39C5BB';
        const MIKU_PINK = '#FF1493';
        const DP_RED = '#E10000';
        const DP_DARK = '#1a0000';

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (!splitX) {
                splitX = width / 2;
                targetSplitX = width / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ELEMENTOS MUNDO DIGITAL (MIKU) ---
        class DigitalData {
            constructor() {
                this.reset();
                this.y = Math.random() * height; // Iniciar en cualquier parte
            }
            reset() {
                this.x = Math.random() * width;
                this.y = -50;
                this.speed = Math.random() * 3 + 1;
                this.value = Math.random() > 0.5 ? '0' : '1';
                this.color = Math.random() > 0.8 ? MIKU_PINK : MIKU_CYAN;
                this.size = Math.random() * 10 + 10;
            }
            update() {
                this.y += this.speed;
                if (frame % 10 === 0 && Math.random() > 0.5) {
                    this.value = this.value === '0' ? '1' : '0';
                }
                if (this.y > height + 50) this.reset();
            }
            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.font = `${this.size}px monospace`;
                ctx.globalAlpha = 0.6;
                ctx.fillText(this.value, this.x, this.y);
                ctx.globalAlpha = 1.0;
            }
        }

        // --- ELEMENTOS MUNDO CAOS (DEADPOOL) ---
        class ChaosSplatter {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 20 + 5;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01;
                // Pequeños satélites (manchas)
                this.drops = [];
                for(let i=0; i<5; i++){
                    this.drops.push({
                        ox: (Math.random() - 0.5) * 40,
                        oy: (Math.random() - 0.5) * 40,
                        r: Math.random() * 8 + 2
                    });
                }
            }
            update() {
                this.life -= this.decay;
                if (this.life <= 0) this.reset();
            }
            draw(ctx) {
                ctx.fillStyle = DP_RED;
                ctx.globalAlpha = this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Dibujar salpicaduras secundarias
                for(let drop of this.drops) {
                    ctx.beginPath();
                    ctx.arc(this.x + drop.ox, this.y + drop.oy, drop.r, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }
        }

        class KatanaSlash {
            constructor() {
                this.active = false;
            }
            trigger() {
                this.active = true;
                this.startX = Math.random() * width;
                this.startY = Math.random() * height;
                this.endX = this.startX + (Math.random() - 0.5) * 600;
                this.endY = this.startY + (Math.random() - 0.5) * 600;
                this.life = 1.0;
            }
            update() {
                if (!this.active) {
                    if (Math.random() < 0.01) this.trigger();
                    return;
                }
                this.life -= 0.1;
                if (this.life <= 0) this.active = false;
            }
            draw(ctx) {
                if (!this.active) return;
                ctx.strokeStyle = '#FFF';
                ctx.lineWidth = this.life * 8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(this.startX, this.startY);
                ctx.lineTo(this.endX, this.endY);
                ctx.stroke();
                
                // Brillo rojo
                ctx.strokeStyle = DP_RED;
                ctx.lineWidth = this.life * 4;
                ctx.stroke();
            }
        }

        // Instanciar objetos
        const digitalData = Array.from({length: 80}, () => new DigitalData());
        const splatters = Array.from({length: 15}, () => new ChaosSplatter());
        const slashes = Array.from({length: 3}, () => new KatanaSlash());

        // --- FUNCIONES PARA DIBUJAR LAS MANOS ---
        function drawMikuHand(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            // Animación sutil de respiración/empuje
            let push = Math.sin(frame * 0.05) * 5; 
            ctx.translate(push, 0); 
            ctx.scale(1.5, 1.5);
            
            // Brillo digital y estilo holograma cibernético
            ctx.shadowColor = MIKU_CYAN;
            ctx.shadowBlur = 15;
            ctx.strokeStyle = MIKU_CYAN;
            ctx.lineWidth = 2;
            ctx.fillStyle = 'rgba(0, 40, 40, 0.85)';
            
            // Forma estilizada de mano robótica/digital empujando la barrera
            ctx.beginPath();
            ctx.moveTo(-60, 50); ctx.lineTo(-30, 40); // Muñeca a palma
            ctx.lineTo(-10, -10); ctx.lineTo(-20, -20); // Pulgar
            ctx.lineTo(0, -50); ctx.lineTo(-10, -60); ctx.lineTo(-25, -40); // Índice
            ctx.lineTo(-15, -65); ctx.lineTo(-25, -75); ctx.lineTo(-35, -45); // Medio
            ctx.lineTo(-30, -60); ctx.lineTo(-40, -65); ctx.lineTo(-45, -40); // Anular
            ctx.lineTo(-45, -50); ctx.lineTo(-55, -50); ctx.lineTo(-50, -20); // Meñique
            ctx.lineTo(-70, 30); // Vuelta a la muñeca
            ctx.closePath();
            
            ctx.fill();
            ctx.stroke();

            // Nodos (articulaciones digitales brillantes)
            ctx.fillStyle = MIKU_PINK;
            ctx.shadowColor = MIKU_PINK;
            let joints = [[-10, -10], [0, -50], [-15, -65], [-30, -60], [-45, -50], [-25, -40], [-35, -45], [-45, -40], [-30, 40]];
            joints.forEach(p => {
                ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, Math.PI*2); ctx.fill();
            });
            ctx.restore();
        }

        function drawDeadpoolHand(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            // Animación de fuerza (tiemblor violento por el esfuerzo)
            let shake = (Math.random() - 0.5) * 4;
            ctx.translate(shake, shake);
            ctx.scale(-1.5, 1.5); // Efecto espejo para que empuje hacia la izquierda
            
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 5;
            ctx.strokeStyle = '#000'; // Líneas gruesas de cómic
            ctx.lineJoin = 'round';
            ctx.lineWidth = 4;
            ctx.fillStyle = DP_RED;
            
            // Forma de guante de Deadpool / Realidad
            ctx.beginPath();
            ctx.moveTo(-65, 55); ctx.lineTo(-25, 45); 
            ctx.lineTo(-5, -5); ctx.lineTo(-15, -15); // Pulgar
            ctx.lineTo(5, -45); ctx.lineTo(-5, -55); ctx.lineTo(-20, -35); // Índice
            ctx.lineTo(-10, -60); ctx.lineTo(-20, -70); ctx.lineTo(-30, -40); // Medio
            ctx.lineTo(-25, -55); ctx.lineTo(-35, -60); ctx.lineTo(-40, -35); // Anular
            ctx.lineTo(-40, -45); ctx.lineTo(-50, -45); ctx.lineTo(-45, -15); // Meñique
            ctx.lineTo(-75, 35); 
            ctx.closePath();
            
            ctx.fill();
            ctx.stroke();
            
            // Detalles del guante (placas tácticas negras)
            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(-25, -5, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(-40, 15, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.restore();
        }

        // --- BUCLE DE ANIMACIÓN ---
        function animate() {
            frame++;

            // Suavizar el movimiento de la barrera (Lerp)
            splitX += (targetSplitX - splitX) * 0.1;

            // Limpiar fondo
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // ==========================================
            // 1. RENDERIZAR MUNDO MIKU (IZQUIERDA)
            // ==========================================
            ctx.save();
            ctx.beginPath();
            // Área de recorte para la izquierda
            ctx.rect(0, 0, splitX, height);
            ctx.clip();

            // Fondo Digital (Azul oscuro / Cian)
            let gradMiku = ctx.createLinearGradient(0, 0, 0, height);
            gradMiku.addColorStop(0, '#001a1a');
            gradMiku.addColorStop(1, '#003333');
            ctx.fillStyle = gradMiku;
            ctx.fillRect(0, 0, width, height);

            // Rejilla de perspectiva digital
            ctx.strokeStyle = 'rgba(57, 197, 187, 0.2)';
            ctx.lineWidth = 1;
            const gridSpacing = 40;
            const offset = (frame * 1) % gridSpacing;
            for(let i = 0; i < height; i += gridSpacing) {
                ctx.beginPath(); ctx.moveTo(0, i + offset); ctx.lineTo(width, i + offset); ctx.stroke();
            }
            for(let i = 0; i < width; i += gridSpacing) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke();
            }

            // Datos Binarios cayendo
            digitalData.forEach(d => {
                d.update();
                d.draw(ctx);
            });

            // Onda de Sonido (Ecualizador) en el centro
            ctx.beginPath();
            ctx.strokeStyle = MIKU_CYAN;
            ctx.lineWidth = 3;
            for(let i = 0; i < width; i += 10) {
                let waveY = height/2 + Math.sin(i * 0.05 + frame * 0.1) * 50 + Math.sin(i * 0.01 - frame * 0.05) * 30;
                if(i === 0) ctx.moveTo(i, waveY);
                else ctx.lineTo(i, waveY);
            }
            ctx.stroke();

            // Dibujar la mano de Miku justo en el límite (splitX) empujando hacia la derecha
            drawMikuHand(ctx, splitX - 2, height / 2);

            // Texto identificativo Miku
            ctx.fillStyle = MIKU_CYAN;
            ctx.font = 'bold 45px "Courier New", monospace';
            ctx.textAlign = 'right';
            ctx.fillText('HATSUNE MIKU', width/2 - 50, height/2 - 120);
            ctx.fillStyle = MIKU_PINK;
            ctx.font = 'bold 30px "Courier New", monospace';
            ctx.fillText(': MIKU', width/2 - 50, height/2 - 80);

            ctx.restore();


            // ==========================================
            // 2. RENDERIZAR MUNDO DEADPOOL (DERECHA)
            // ==========================================
            ctx.save();
            ctx.beginPath();
            // Área de recorte para la derecha
            ctx.rect(splitX, 0, width - splitX, height);
            ctx.clip();

            // Fondo Caos (Rojo oscuro sucio)
            ctx.fillStyle = DP_DARK;
            ctx.fillRect(0, 0, width, height);

            // Textura de cómic (puntos de semitono falsos/ruido rápido)
            if (frame % 5 === 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                for(let i=0; i<100; i++) {
                    ctx.fillRect(Math.random()*width, Math.random()*height, 2, 2);
                }
            }

            // Manchas de "Caos" (Sangre/Pintura)
            splatters.forEach(s => {
                s.update();
                s.draw(ctx);
            });

            // Cortes de Catana
            slashes.forEach(s => {
                s.update();
                s.draw(ctx);
            });

            // Dibujar la mano de Deadpool (Braulio) en el límite empujando hacia la izquierda
            drawDeadpoolHand(ctx, splitX + 2, height / 2);

            // Texto Cómic (Braulio)
            ctx.fillStyle = DP_RED;
            ctx.font = '900 45px Impact, sans-serif';
            ctx.textAlign = 'left';
            
            // Efecto de sombra dura estilo cómic
            ctx.shadowColor = '#000';
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;
            
            // Temblor en el texto
            let shakeX = (Math.random() - 0.5) * 4;
            let shakeY = (Math.random() - 0.5) * 4;
            
            ctx.fillText('BRAULIO J VELASQUEZ H', width/2 + 50 + shakeX, height/2 - 120 + shakeY);
            
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 30px Impact, sans-serif';
            ctx.fillText(': DEADPOOL', width/2 + 50 + shakeX, height/2 - 80 + shakeY);
            
            // Onomatopeya ocasional
            if (Math.random() < 0.02) {
                ctx.fillStyle = '#FFD700'; // Amarillo
                ctx.font = 'bold 50px Comic Sans MS, cursive, sans-serif';
                let tx = width/2 + 100 + Math.random() * 200;
                let ty = height/2 + (Math.random()-0.5) * 400;
                ctx.fillText('BLAM!', tx, ty);
            }

            ctx.shadowColor = 'transparent'; // Resetear sombra
            ctx.restore();


            // ==========================================
            // 3. LA FRONTERA / LA BRECHA (GLITCH)
            // ==========================================
            
            // Línea divisoria central con efecto neón/glitch
            ctx.lineWidth = 4;
            
            // Capa Cian (Miku) desplazada
            ctx.beginPath();
            ctx.strokeStyle = MIKU_CYAN;
            ctx.moveTo(splitX - 2 + (Math.random() - 0.5) * 10, 0);
            ctx.lineTo(splitX - 2 + (Math.random() - 0.5) * 10, height);
            ctx.stroke();

            // Capa Roja (Deadpool) desplazada
            ctx.beginPath();
            ctx.strokeStyle = DP_RED;
            ctx.moveTo(splitX + 2 + (Math.random() - 0.5) * 10, 0);
            ctx.lineTo(splitX + 2 + (Math.random() - 0.5) * 10, height);
            ctx.stroke();

            // Centro blanco brillante
            ctx.beginPath();
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2;
            ctx.moveTo(splitX, 0);
            ctx.lineTo(splitX, height);
            ctx.stroke();

            // Glitches horizontales aleatorios cruzando la frontera
            if (Math.random() < 0.15) {
                let gY = Math.random() * height;
                let gHeight = Math.random() * 20 + 5;
                let gWidth = Math.random() * 80 + 20;
                
                // Mezcla de colores en el glitch
                ctx.fillStyle = Math.random() > 0.5 ? MIKU_CYAN : DP_RED;
                ctx.globalAlpha = 0.8;
                ctx.fillRect(splitX - gWidth/2, gY, gWidth, gHeight);
                ctx.globalAlpha = 1.0;
            }

            requestAnimationFrame(animate);
        }

        // --- INTERACTIVIDAD ---
        canvas.addEventListener('mousemove', (e) => {
            targetSplitX = e.clientX;
        });

        // Soporte para pantallas táctiles
        canvas.addEventListener('touchmove', (e) => {
            targetSplitX = e.touches[0].clientX;
            e.preventDefault(); // Evitar scroll
        }, { passive: false });

        // Iniciar animación
        animate();

    </script>
</body>
</html>
