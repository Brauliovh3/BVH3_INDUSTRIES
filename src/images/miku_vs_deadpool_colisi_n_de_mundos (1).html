<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miku vs Deadpool: Colisión de Mundos</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            cursor: crosshair;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Capa de ruido y viñeta general */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            z-index: 10;
        }
        
        .instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 20;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>
    <div class="instruction">Desliza el ratón para mover la frontera</div>
    <canvas id="mainCanvas"></canvas>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let splitX, targetSplitX;

        // Variables de tiempo
        let frame = 0;

        // Colores temáticos
        const MIKU_CYAN = '#39C5BB';
        const MIKU_PINK = '#FF1493';
        const DP_RED = '#E10000';
        const DP_DARK = '#1a0000';

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (!splitX) {
                splitX = width / 2;
                targetSplitX = width / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ELEMENTOS MUNDO DIGITAL (MIKU) ---
        class MusicNote {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }
            reset() {
                this.x = Math.random() * width;
                this.y = height + 50;
                this.speed = Math.random() * 2 + 1;
                const notes = ['♪', '♫', '♩', '♬'];
                this.note = notes[Math.floor(Math.random() * notes.length)];
                this.color = Math.random() > 0.5 ? MIKU_PINK : MIKU_CYAN;
                this.size = Math.random() * 25 + 15;
            }
            update() {
                this.y -= this.speed; // Las notas flotan hacia arriba
                if (this.y < -50) this.reset();
            }
            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.font = `${this.size}px sans-serif`;
                ctx.globalAlpha = 0.6;
                ctx.fillText(this.note, this.x, this.y);
                ctx.globalAlpha = 1.0;
            }
        }

        // --- ELEMENTOS MUNDO CAOS / CÓDIGOS (DEPOOL) ---
        class CodeDrop {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }
            reset() {
                this.x = Math.random() * width;
                this.y = -50;
                this.speed = Math.random() * 4 + 2;
                this.value = Math.random() > 0.5 ? '0' : '1';
                // Mezcla de verde hacker y rojo
                this.color = Math.random() > 0.7 ? '#00FF00' : DP_RED; 
                this.size = Math.random() * 12 + 10;
            }
            update() {
                this.y += this.speed;
                if (frame % 5 === 0 && Math.random() > 0.5) {
                    this.value = this.value === '0' ? '1' : '0';
                }
                if (this.y > height + 50) this.reset();
            }
            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.font = `bold ${this.size}px monospace`;
                ctx.globalAlpha = 0.8;
                ctx.fillText(this.value, this.x, this.y);
                ctx.globalAlpha = 1.0;
            }
        }

        class ChaosSplatter {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 20 + 5;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01;
                this.drops = [];
                for(let i=0; i<5; i++){
                    this.drops.push({
                        ox: (Math.random() - 0.5) * 40,
                        oy: (Math.random() - 0.5) * 40,
                        r: Math.random() * 8 + 2
                    });
                }
            }
            update() {
                this.life -= this.decay;
                if (this.life <= 0) this.reset();
            }
            draw(ctx) {
                ctx.fillStyle = DP_RED;
                ctx.globalAlpha = this.life * 0.5; // Menos invasivo para dejar ver los códigos
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                for(let drop of this.drops) {
                    ctx.beginPath();
                    ctx.arc(this.x + drop.ox, this.y + drop.oy, drop.r, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }
        }

        class KatanaSlash {
            constructor() { this.active = false; }
            trigger() {
                this.active = true;
                this.startX = Math.random() * width;
                this.startY = Math.random() * height;
                this.endX = this.startX + (Math.random() - 0.5) * 600;
                this.endY = this.startY + (Math.random() - 0.5) * 600;
                this.life = 1.0;
            }
            update() {
                if (!this.active) {
                    if (Math.random() < 0.01) this.trigger();
                    return;
                }
                this.life -= 0.1;
                if (this.life <= 0) this.active = false;
            }
            draw(ctx) {
                if (!this.active) return;
                ctx.strokeStyle = '#FFF';
                ctx.lineWidth = this.life * 8;
                ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(this.startX, this.startY); ctx.lineTo(this.endX, this.endY); ctx.stroke();
                ctx.strokeStyle = DP_RED;
                ctx.lineWidth = this.life * 4;
                ctx.stroke();
            }
        }

        // Instanciar objetos
        const musicNotes = Array.from({length: 45}, () => new MusicNote());
        const codeDrops = Array.from({length: 100}, () => new CodeDrop());
        const splatters = Array.from({length: 10}, () => new ChaosSplatter());
        const slashes = Array.from({length: 2}, () => new KatanaSlash());

        // --- SILUETAS SIMPLES DE LOS PERSONAJES ---
        function drawMikuSilhouette(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y + 50); // Ajuste vertical
            
            // Animación sutil de baile/flote
            let bounce = Math.sin(frame * 0.05) * 10; 
            ctx.translate(0, bounce); 
            
            // Estilo holográfico simple
            ctx.fillStyle = 'rgba(57, 197, 187, 0.4)';
            ctx.strokeStyle = MIKU_CYAN;
            ctx.lineWidth = 3;
            ctx.shadowColor = MIKU_PINK;
            ctx.shadowBlur = 15;
            
            // Cabeza
            ctx.beginPath();
            ctx.arc(-40, -100, 25, 0, Math.PI*2);
            ctx.fill(); ctx.stroke();

            // Cuerpo (Triángulo invertido)
            ctx.beginPath();
            ctx.moveTo(-40, -75);
            ctx.lineTo(-70, 40);
            ctx.lineTo(-10, 40);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Coletas características (curvas simples)
            ctx.beginPath();
            ctx.moveTo(-60, -100);
            ctx.quadraticCurveTo(-120, -50, -110, 30); // Coleta izquierda
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-20, -100);
            ctx.quadraticCurveTo(30, -50, 10, 20); // Coleta derecha
            ctx.stroke();

            ctx.restore();
        }

        function drawDepoolSilhouette(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y + 50); 
            
            // Animación estática pero temblorosa
            let shake = (Math.random() - 0.5) * 3;
            ctx.translate(shake, shake);
            
            ctx.fillStyle = 'rgba(225, 0, 0, 0.4)';
            ctx.strokeStyle = DP_RED;
            ctx.lineWidth = 4;
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 10;
            
            // Cabeza (Óvalo rudo)
            ctx.beginPath();
            ctx.arc(40, -100, 22, 0, Math.PI*2);
            ctx.fill(); ctx.stroke();

            // Cuerpo (Robusto, trapecio)
            ctx.beginPath();
            ctx.moveTo(40, -78);
            ctx.lineTo(10, 40);
            ctx.lineTo(70, 40);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Catanas cruzadas en la espalda (Líneas blancas simples)
            ctx.beginPath();
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            // Katana 1 (\)
            ctx.moveTo(0, -130); ctx.lineTo(80, -60);
            // Katana 2 (/)
            ctx.moveTo(80, -130); ctx.lineTo(0, -60);
            ctx.stroke();
            
            ctx.restore();
        }

        // --- BUCLE DE ANIMACIÓN ---
        function animate() {
            frame++;

            // Suavizar el movimiento de la barrera (Lerp)
            splitX += (targetSplitX - splitX) * 0.1;

            // Limpiar fondo
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // ==========================================
            // 1. RENDERIZAR MUNDO MIKU (IZQUIERDA)
            // ==========================================
            ctx.save();
            ctx.beginPath();
            // Área de recorte para la izquierda
            ctx.rect(0, 0, splitX, height);
            ctx.clip();

            // Fondo Digital (Azul oscuro / Cian)
            let gradMiku = ctx.createLinearGradient(0, 0, 0, height);
            gradMiku.addColorStop(0, '#001a1a');
            gradMiku.addColorStop(1, '#003333');
            ctx.fillStyle = gradMiku;
            ctx.fillRect(0, 0, width, height);

            // Rejilla
            ctx.strokeStyle = 'rgba(57, 197, 187, 0.15)';
            ctx.lineWidth = 1;
            const gridSpacing = 40;
            const offset = (frame * 1) % gridSpacing;
            for(let i = 0; i < height; i += gridSpacing) {
                ctx.beginPath(); ctx.moveTo(0, i + offset); ctx.lineTo(width, i + offset); ctx.stroke();
            }

            // Notas Musicales Flotando
            musicNotes.forEach(n => {
                n.update();
                n.draw(ctx);
            });

            // Onda de Sonido (Ecualizador)
            ctx.beginPath();
            ctx.strokeStyle = MIKU_CYAN;
            ctx.lineWidth = 3;
            for(let i = 0; i < width; i += 10) {
                let waveY = height/2 + Math.sin(i * 0.05 + frame * 0.1) * 50 + Math.sin(i * 0.01 - frame * 0.05) * 30;
                if(i === 0) ctx.moveTo(i, waveY);
                else ctx.lineTo(i, waveY);
            }
            ctx.stroke();

            // Silueta de Miku
            drawMikuSilhouette(ctx, splitX - 10, height / 2);

            // Texto identificativo Miku
            ctx.fillStyle = MIKU_CYAN;
            ctx.font = 'bold 45px "Courier New", monospace';
            ctx.textAlign = 'right';
            ctx.fillText('HATSUNE MIKU', width/2 - 50, height/2 - 120);
            ctx.fillStyle = MIKU_PINK;
            ctx.font = 'bold 30px "Courier New", monospace';
            ctx.fillText(': MIKU', width/2 - 50, height/2 - 80);

            ctx.restore();


            // ==========================================
            // 2. RENDERIZAR MUNDO DEPOOL (DERECHA)
            // ==========================================
            ctx.save();
            ctx.beginPath();
            // Área de recorte para la derecha
            ctx.rect(splitX, 0, width - splitX, height);
            ctx.clip();

            // Fondo Caos
            ctx.fillStyle = DP_DARK;
            ctx.fillRect(0, 0, width, height);

            // Textura
            if (frame % 5 === 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                for(let i=0; i<100; i++) {
                    ctx.fillRect(Math.random()*width, Math.random()*height, 2, 2);
                }
            }

            // Códigos cayendo (Braulio en la Matrix)
            codeDrops.forEach(c => {
                c.update();
                c.draw(ctx);
            });

            // Manchas y cortes
            splatters.forEach(s => { s.update(); s.draw(ctx); });
            slashes.forEach(s => { s.update(); s.draw(ctx); });

            // Silueta de DEPOOL
            drawDepoolSilhouette(ctx, splitX + 10, height / 2);

            // Texto Cómic (DEPOOL)
            ctx.fillStyle = DP_RED;
            ctx.font = '900 45px Impact, sans-serif';
            ctx.textAlign = 'left';
            
            ctx.shadowColor = '#000';
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;
            
            let shakeX = (Math.random() - 0.5) * 4;
            let shakeY = (Math.random() - 0.5) * 4;
            
            ctx.fillText('BRAULIO J VELASQUEZ H', width/2 + 50 + shakeX, height/2 - 120 + shakeY);
            
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 30px Impact, sans-serif';
            ctx.fillText(': DEPOOL', width/2 + 50 + shakeX, height/2 - 80 + shakeY);
            
            ctx.shadowColor = 'transparent';
            ctx.restore();


            // ==========================================
            // 3. LA FRONTERA / LA BRECHA (GLITCH)
            // ==========================================
            
            ctx.lineWidth = 4;
            
            ctx.beginPath();
            ctx.strokeStyle = MIKU_CYAN;
            ctx.moveTo(splitX - 2 + (Math.random() - 0.5) * 10, 0);
            ctx.lineTo(splitX - 2 + (Math.random() - 0.5) * 10, height);
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = DP_RED;
            ctx.moveTo(splitX + 2 + (Math.random() - 0.5) * 10, 0);
            ctx.lineTo(splitX + 2 + (Math.random() - 0.5) * 10, height);
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2;
            ctx.moveTo(splitX, 0);
            ctx.lineTo(splitX, height);
            ctx.stroke();

            if (Math.random() < 0.15) {
                let gY = Math.random() * height;
                let gHeight = Math.random() * 20 + 5;
                let gWidth = Math.random() * 80 + 20;
                
                ctx.fillStyle = Math.random() > 0.5 ? MIKU_CYAN : DP_RED;
                ctx.globalAlpha = 0.8;
                ctx.fillRect(splitX - gWidth/2, gY, gWidth, gHeight);
                ctx.globalAlpha = 1.0;
            }

            requestAnimationFrame(animate);
        }

        // --- INTERACTIVIDAD ---
        canvas.addEventListener('mousemove', (e) => {
            targetSplitX = e.clientX;
        });

        // Soporte para pantallas táctiles
        canvas.addEventListener('touchmove', (e) => {
            targetSplitX = e.touches[0].clientX;
            e.preventDefault(); // Evitar scroll
        }, { passive: false });

        // Iniciar animación
        animate();

    </script>
</body>
</html>
